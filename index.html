<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><meta name="theme-color" content="#101C2C"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Money">
<title>Money Tracker</title>
<style>
:root{color-scheme:light;--bg:#F3F6F3;--card:#FFFFFF;--tx:#101C2C;--mut:#58685F;--line:#DCE4DF;--ice:#E7F0EC;
--acc:#17695A;--accx:#FFFFFF;--pos:#17805F;--red:#C4503A;--gold:#D9962B;
--hero:#101C2C;--herotx:#F4F8F5;--herom:#A3B5AD;--herol:#2B3A4D;--scrim:rgba(10,18,16,.5);
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;
--navy:var(--tx);--blue:var(--acc);
--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Charter,Georgia,serif;
--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
--sh:0 1px 2px rgba(16,28,44,.05),0 6px 18px rgba(16,28,44,.05)}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;--bg:#0B1311;--card:#131E1A;--tx:#E8EFEB;--mut:#93A59D;--line:#23322C;--ice:#19282A;
--acc:#4BBBA0;--accx:#052019;--pos:#4FC6A3;--red:#E8806A;--gold:#E8AE4A;
--hero:#1A2B26;--herotx:#F1F6F3;--herom:#9FB4AC;--herol:#2F443C;--scrim:rgba(0,0,0,.62);
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;;--sh:0 1px 0 rgba(255,255,255,.03)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0B1311;--card:#131E1A;--tx:#E8EFEB;--mut:#93A59D;--line:#23322C;--ice:#19282A;
--acc:#4BBBA0;--accx:#052019;--pos:#4FC6A3;--red:#E8806A;--gold:#E8AE4A;
--hero:#1A2B26;--herotx:#F1F6F3;--herom:#9FB4AC;--herol:#2F443C;--scrim:rgba(0,0,0,.62);
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;;--sh:0 1px 0 rgba(255,255,255,.03)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.45 var(--sans);background:var(--bg);color:var(--tx);padding-bottom:92px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{font-family:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header h1{font:600 24px/1.1 var(--serif);margin:0;letter-spacing:-.01em;color:var(--tx)}
.hb{display:flex;gap:6px;align-items:center}
.ib{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:12px;padding:0}
.ib:hover{border-color:var(--acc);color:var(--acc)}
#ud{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:12px;font-size:14px}
main{max-width:680px;margin:0 auto;padding:16px}
.hero{position:relative;background:var(--hero);color:var(--herotx);border-radius:22px;padding:22px 22px 20px;overflow:hidden}
.hero>span{font-size:14px;color:var(--herom)}
.hero b{display:block;font:600 40px/1.05 var(--serif);margin:6px 0 12px;letter-spacing:-.015em;font-variant-numeric:lining-nums tabular-nums}
.row{display:flex;gap:8px;justify-content:space-between}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.stat{flex:1;font-size:13px;color:var(--herom)}
.stat strong{display:block;margin-top:2px;color:var(--herotx);font:600 16px/1.2 var(--serif);font-variant-numeric:lining-nums tabular-nums}
.hero .spark{margin:2px -22px 14px;display:block;width:calc(100% + 44px)}
h2{display:flex;align-items:baseline;justify-content:space-between;font-size:16px;font-weight:650;color:var(--tx);margin:28px 0 8px;letter-spacing:.005em}
h2 a{font-size:13px;font-weight:500;text-decoration:none}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover{background:color-mix(in srgb,var(--ice) 55%,transparent)}
.item small{color:var(--mut);display:block;font-size:13px;margin-top:1px}
.item>b{font-variant-numeric:tabular-nums;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--sh)}
.card+.card{margin-top:12px}
.bar{height:8px;background:var(--ice);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.bar.over i{background:var(--red)}.over{color:var(--red)}
.pos{color:var(--pos)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:10px 2px 9px;font-size:11px;color:var(--mut);position:relative}
nav button.on{color:var(--acc);font-weight:650}
nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
nav .dk,nav .brand{display:none}
#f{position:fixed;right:16px;bottom:84px;z-index:6;display:flex;align-items:center;gap:8px;background:var(--acc);color:var(--accx);border:0;border-radius:28px;padding:14px 20px;font-size:16px;font-weight:600;box-shadow:0 8px 22px rgba(0,0,0,.22)}
button.p{background:var(--acc);color:var(--accx);border:1px solid var(--acc);border-radius:12px;padding:13px 16px;font-size:16px;font-weight:600}
button.o{background:transparent;color:var(--acc);border:1px solid var(--acc);border-radius:12px;padding:12px 16px;font-size:16px;font-weight:550}
button:disabled{opacity:.45}
.modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--card);color:var(--tx);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:22px 20px 26px;display:grid;gap:11px;max-height:90vh;overflow:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
.sheet>b:first-child{font:600 20px/1.2 var(--serif)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);padding:12px;border:1px solid var(--line);border-radius:12px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
label.muted{display:grid;gap:5px;font-size:13px}
.seg{display:flex;gap:4px;background:var(--ice);padding:4px;border-radius:14px}
.seg button{flex:1;padding:9px 6px;border:0;background:transparent;color:var(--mut);border-radius:10px;font-size:15px;font-weight:550}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.lock{position:fixed;inset:0;background:var(--hero);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff}
.lock input{width:170px;text-align:center;font-size:28px;letter-spacing:8px;color:#fff;background:transparent;border-color:#ffffff55}
.muted{color:var(--mut)}
#sb{position:fixed;left:0;right:0;bottom:62px;background:var(--card);border-top:2px solid var(--acc);padding:10px 14px;display:none;align-items:center;gap:10px;z-index:7;box-shadow:0 -4px 12px #0002}
#sb button{padding:10px 14px;font-size:15px}a{color:var(--acc)}
.note{background:var(--ice);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:14px;line-height:1.5}
.note.warn{border-left-color:var(--gold)}.note.bad{border-left-color:var(--red)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.cal b{font-size:12px;color:var(--mut);text-align:center;font-weight:550}
.cal div{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px;cursor:pointer}
.cal div:hover{border-color:var(--acc)}
.cal div.cov{background:var(--acc);color:var(--accx);border-color:var(--acc)}
.cal div.unp{background:var(--red);color:#fff;border-color:var(--red)}
.cal div.due{box-shadow:inset 0 0 0 2px var(--tx)}
.cal div.td{font-weight:800;text-decoration:underline}
.cal div.mt{visibility:hidden}
.cal i{font-size:10px;font-style:normal;height:11px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 0}
.chips button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:16px;font-size:13px;font-weight:550;box-shadow:var(--sh)}
.chips button svg{color:var(--acc)}
.chips button:hover{border-color:var(--acc)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kv div{font-size:13px;color:var(--mut)}.kv strong{display:block;color:var(--tx);font:600 17px/1.25 var(--serif);font-variant-numeric:lining-nums tabular-nums}
.split{display:flex;height:12px;border-radius:8px;overflow:hidden;background:var(--ice);gap:2px;margin:10px 0 8px}
.split i{display:block;height:100%}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mut);margin-top:8px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.empty{text-align:center;padding:26px 12px;color:var(--mut);border:1px dashed var(--line);border-radius:16px}
#tip{position:fixed;z-index:40;display:none;pointer-events:none;background:var(--tx);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:13px;line-height:1.3;white-space:nowrap;max-width:260px;transform:translate(-50%,-100%);box-shadow:0 4px 14px rgba(0,0,0,.25)}
svg text{font-family:var(--sans)}
body.hide .hero b,body.hide .stat strong,body.hide .item>b,body.hide .kv strong,body.hide .amt{filter:blur(9px);user-select:none}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:22px;max-width:500px;padding:26px}}
@media (min-width:900px){
 body{padding:0 0 0 232px}
 nav{top:0;bottom:0;right:auto;width:232px;flex-direction:column;gap:2px;padding:22px 14px;border-top:0;border-right:1px solid var(--line);overflow:auto;background:var(--card)}
 nav .brand{display:block;font:600 22px/1.1 var(--serif);padding:4px 12px 20px;letter-spacing:-.01em}
 nav .dk{display:flex}nav .mo{display:none}
 nav button{flex:none;flex-direction:row;gap:12px;font-size:15px;padding:11px 14px;border-radius:12px;text-align:left}
 nav button.on{background:var(--ice)}nav button.on::before{display:none}
 nav .sep{height:1px;background:var(--line);margin:10px 8px}
 header{padding:18px 32px}
 main{max-width:980px;padding:24px 32px 60px}
 #f{bottom:28px;right:36px}
 #sb{left:232px;bottom:0}
 .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
 .two>.card+.card{margin-top:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{nav,#f,header,#sb,.seg,button,#tip{display:none!important}body{padding:0;background:#fff}main{max-width:none;padding:0}.hero{background:#fff!important;color:#000!important;border:1px solid #888}.hero *,.stat strong{color:#000!important}.card{box-shadow:none;break-inside:avoid}details{display:block}details>summary{display:none}details[open],details{display:block}}
.ch{align-items:baseline;margin-bottom:8px}.ch b{font:600 17px/1.2 var(--serif)}.ch a{font-size:13px;text-decoration:none}
.card .item{padding-left:0;padding-right:0}.card .item:last-child{border-bottom:0}
.card .item:hover{background:transparent}
.two{margin-top:14px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:550}
.brand{display:none}
</style></head><body>
<header><h1 id="t">Overview</h1><div class="hb"><button class="ib" id="sr" aria-label="Search"></button><button class="ib" id="hd" aria-label="Hide or show amounts"></button><button id="ud" onclick="undo()" aria-label="Undo last change"></button></div></header>
<main id="v"></main>
<div id="sb"></div>
<button id="f">+ Add</button>
<nav id="nv" aria-label="Main"></nav>
<script>
const CATS=['Food','Rent','Transport','Fun','Bills','Study','Other'];
const KINDS=['Loan','Wages','Invoice','Deposit','Refund','Rent','Split','Other'];
const AKINDS=['Person','Employer','Client','Business','Other'];
let D={t:[],p:[],e:[],u:[],b:{},r:90,pin:null,ob:{Cash:0,Bank:0},rent:null,rules:{},rem:false,w:[],sv:[],ri:[],rm:[],db:[],arch:[]};
try{D=Object.assign(D,JSON.parse(localStorage.getItem('mt')||'{}'))}catch(e){}
let H=[];try{H=JSON.parse(localStorage.getItem('mth')||'[]')}catch(e){}
let last=JSON.stringify(D);
const persistH=()=>{while(true){try{localStorage.setItem('mth',JSON.stringify(H));return}catch(e){if(!H.length)return;H.shift()}}};
const save=()=>{const now=JSON.stringify(D);if(now!==last){H.push(last);if(H.length>20)H.shift();last=now;persistH()}try{localStorage.setItem('mt',now)}catch(e){}render()};
function undo(){
 if(!H.length){toast('Nothing to undo');return}
 const o=JSON.parse(H.pop());o.pin=D.pin;
 D=Object.assign({t:[],p:[],e:[],u:[],b:{},r:90,ob:{Cash:0,Bank:0},rent:null,rules:{},rem:false,w:[],sv:[],ri:[],rm:[],db:[],arch:[]},o);
 last=JSON.stringify(D);try{localStorage.setItem('mt',last)}catch(e){}persistH();render();toast('Undone. '+H.length+' more step'+(H.length===1?'':'s')+' you can undo')}
const $=s=>document.querySelector(s);
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const base=(a,c)=>c==='NPR'?a/D.r:a;
const fmt=(v,c)=>{const ng=v<-0.004,a=Math.abs(v);return (ng?'-':'')+(c==='NPR'?'Rs '+Math.round(a).toLocaleString():'$'+a.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}))};
const day=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dt=v=>v?new Date(v+'T12:00:00').toISOString():null;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bal=pid=>D.e.filter(e=>e.pid===pid).reduce((s,e)=>s+base(e.gave?e.a:-e.a,e.c),0);
const owed=pid=>{const m={};D.e.filter(e=>e.pid===pid).forEach(e=>m[e.c]=(m[e.c]||0)+(e.gave?e.a:-e.a));const p=Object.entries(m).filter(([,v])=>Math.abs(v)>.004).map(([c,v])=>fmt(v,c));return p.length?p.join(' + '):'nothing'};
let tab='home',person=null,per='m',exTab='ex',exCat=null,cv='out',fc='All',imp=null,rentMonth=new Date();

function people(){
 if(person){const p=D.p.find(x=>x.id===person);if(p)return ledger(p);person=null}
 return D.p.length?selBar('p',D.p)+[...D.p].sort((a,b)=>bal(b.id)-bal(a.id)).map(p=>`<div class="item" onclick="${selOc('p',p.id,`person='${p.id}';render()`)}">${selCb('p',p.id)}<span style="flex:1">${esc(p.name)}<small>${esc(p.k||'Person')}${p.phone?' · '+esc(p.phone):''}</small></span><b style="color:${bal(p.id)>0?'var(--blue)':'#999'}">${fmt(bal(p.id),'AUD')}</b></div>`).join(''):'<p class="muted">No accounts yet. Tap Add account for a person, employer, client or business.</p>'}
function ledger(p){
 const b=bal(p.id),es=D.e.filter(e=>e.pid===p.id).sort((a,b)=>new Date(b.d)-new Date(a.d));
 return `<p><a href="#" onclick="person=null;render();return false">&larr; All people</a></p><div class="hero"><span>${b>0?'Owes you':'Settled'} · ${esc(p.name)}</span><b>${owed(p.id)}</b></div>
 <div class="row" style="margin:12px 0"><button class="p" style="flex:1" onclick="entryForm('${p.id}',true)">Add amount owed</button><button class="o" style="flex:1" onclick="entryForm('${p.id}',false)">Payment received</button></div>
 <div class="row"><button class="o" style="flex:1" onclick="share(remind('${p.id}'))">Send reminder</button><button class="o" style="flex:1" onclick="share(stmt('${p.id}'))">Share statement</button></div><div class="row" style="margin-top:8px"><button class="o" style="flex:1" onclick="personForm('${p.id}')">Edit or delete account</button></div><p class="muted" style="font-size:13px">Tap any entry below to edit or delete it.</p>`
 +(es.length?selBar('e',es)+es.map(e=>{const late=e.gave&&b>0&&e.due&&new Date(e.due)<new Date();return `<div class="item" onclick="${selOc('e',e.id,`entryForm('${p.id}',${e.gave},'${e.id}')`)}">${selCb('e',e.id)}<span style="flex:1">${e.gave?(e.k||'Owed'):'Received'} ${fmt(e.a,e.c)}<small class="${late?'over':''}">${e.gave&&e.k==='Wages'?(e.f?'worked '+day(e.f)+' to '+day(e.d):'worked up to '+day(e.d)):day(e.d)}${e.n?' · '+esc(e.n):''}${e.due?' · due '+day(e.due):''}${late?' · overdue':''}${!e.gave?(e.tid?' · added to your money':' · not added to your money'):''}</small></span></div>`}).join(''):'<p class="muted">No entries yet.</p>')}
/* ---------- Work calendar ---------- */
let workMonth=new Date();
const nh=v=>+(+v).toFixed(2);
const dl=d=>new Date(d+'T12:00:00').toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const wc=w=>w.c||'AUD';
const wEarn=(l,c)=>l.filter(w=>wc(w)===c).reduce((s,w)=>s+w.h*w.r,0);
const wTot=l=>{const cs=['AUD','NPR'].filter(c=>l.some(w=>wc(w)===c));return cs.length?cs.map(c=>fmt(wEarn(l,c),c)).join(' + '):fmt(0,'AUD')};
function workDay(s,eid){
 const o=D.w.find(w=>w.id===eid),all=[...D.w].sort((a,b)=>b.d.localeCompare(a.d)),lastW=all[0],d0=o?o.d:s,same=D.w.filter(w=>w.d===d0&&w.id!==eid);
 let cur=o?wc(o):(lastW?wc(lastW):'AUD'),touched=!!o;
 const places=[...new Set(all.map(w=>w.p).filter(Boolean))];
 const m=modal(`<b style="color:var(--navy)">${o?'Edit shift':'Add shift'} &middot; ${dl(d0)}</b>`
  +(same.length?`<div class="note" style="margin:0">Other shifts this day:${same.map(w=>`<div class="row" style="align-items:center;margin-top:6px"><span>${esc(w.p||'Work')} &middot; ${nh(w.h)} h</span><button class="o" style="padding:6px 12px;font-size:14px" data-e="${w.id}">Edit</button></div>`).join('')}</div>`:'')
  +`<label class="muted">Date<input id="d" type="date" value="${d0}"></label>
  <label class="muted">Where did you work?<input id="p" list="pl" placeholder="Workplace or client" value="${esc(o?o.p:'')}"></label><datalist id="pl">${places.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
  <label class="muted">How many hours?<input id="h" type="number" inputmode="decimal" step="any" placeholder="e.g. 7.5" value="${o?o.h:''}"></label>
  <label class="muted">Pay rate per hour<input id="r" type="number" inputmode="decimal" step="any" placeholder="e.g. 28.50" value="${o?o.r:(lastW?lastW.r:'')}"></label>
  <div class="seg" id="wc"><button data-v="AUD">AUD</button><button data-v="NPR">NPR</button></div>
  <div id="tt" style="font-weight:700;color:var(--navy)"></div>
  <label style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="pd" style="width:auto" ${o&&o.paid?'checked':''}>Already paid</label>
  <button class="p" id="s">Save</button>${o?'<button class="o" id="x">Delete this shift</button>':''}`);
 seg(m,'#wc',()=>cur,v=>{cur=v;tt()});
 const g=i=>m.querySelector(i);

function nextDate(s,f,dom){const d=new Date(s+'T12:00:00');if(f==='weekly')return addD(s,7);if(f==='fortnightly')return addD(s,14);const y=d.getFullYear(),m=d.getMonth()+1;return day(new Date(y,m,Math.min(dom||d.getDate(),dimOf(y,m)),12))}

/* ===== Receipt photos (kept in IndexedDB so they do not fill normal storage) ===== */
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('mt_img',1);r.onupgradeneeded=()=>r.result.createObjectStore('i');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const imgPut=async(k,v)=>{try{const d=await idb();d.transaction('i','readwrite').objectStore('i').put(v,k)}catch(e){}};
const imgDel=async k=>{try{const d=await idb();d.transaction('i','readwrite').objectStore('i').delete(k)}catch(e){}};
const imgGet=k=>new Promise(async ok=>{try{const d=await idb(),r=d.transaction('i').objectStore('i').get(k);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>ok(null)}catch(e){ok(null)}});
const imgAll=()=>new Promise(async ok=>{const o={};try{const d=await idb(),r=d.transaction('i').objectStore('i').openCursor();r.onsuccess=()=>{const c=r.result;if(c){o[c.key]=c.value;c.continue()}else ok(o)};r.onerror=()=>ok(o)}catch(e){ok(o)}});
const shrink=file=>new Promise(ok=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.72))};im.onerror=()=>ok(null);im.src=r.result};r.onerror=()=>ok(null);r.readAsDataURL(file)});

/* ===== Debts and loans ===== */
const dbBal=d=>Math.max(0,d.b0-d.log.reduce((s,x)=>s+x.a,0));
function simDebt(B,apr,P,extra){const r=apr/1200,pay=P+(extra||0);if(B<=.005)return{ok:true,m:0,int:0};if(pay<=B*r+.005)return{ok:false};let m=0,int=0;while(B>.005&&m<1200){const i=B*r;int+=i;B=B+i-pay;m++}return{ok:true,m,int}}
const inMonths=k=>{const d=new Date();d.setMonth(d.getMonth()+k);return d.toLocaleDateString('en-AU',{month:'short',year:'numeric'})};
function debtPage(){
 const L=D.db.map(d=>({d,b:dbBal(d)})),tot=L.reduce((s,x)=>s+x.b,0),pm=L.filter(x=>x.b>0).reduce((s,x)=>s+x.d.pay,0),sims=L.map(x=>simDebt(x.b,x.d.apr,x.d.pay)),free=sims.every(s=>s.ok)?Math.max(0,...sims.map(s=>s.m)):null,intr=sims.reduce((s,x)=>s+(x.ok?x.int:0),0);
 return `<div class="hero"><span>Total owing</span><b>${fmt(tot,'AUD')}</b><div class="grid3"><div class="stat">Monthly payments<strong>${fmt(pm,'AUD')}</strong></div><div class="stat">Debt-free<strong>${tot<=0?'Now':free==null?'–':inMonths(free)}</strong></div><div class="stat">Interest to come<strong>${fmt(intr,'AUD')}</strong></div></div></div>`
 +`<button class="p" style="width:100%;margin-top:14px" onclick="debtForm()">+ Add a debt or loan</button>`
 +(L.length?L.map(({d,b},i)=>{const s=sims[i],p=d.b0>0?Math.min(100,100*(d.b0-b)/d.b0):100;return `<div class="card" style="margin-top:12px;cursor:pointer" onclick="debtView('${d.id}')"><div class="row"><b>${esc(d.n)}</b><b>${fmt(b,'AUD')}</b></div><div class="bar"><i style="width:${p}%"></i></div><p class="muted" style="margin:8px 0 0;font-size:14px">${b<=0?'Paid off.':s.ok?`Paid off by <b style="color:var(--tx)">${inMonths(s.m)}</b> at ${fmt(d.pay,'AUD')} a month. Interest left: ${fmt(s.int,'AUD')}.`:'The monthly payment does not cover the interest. Raise it to make progress.'}</p></div>`}).join(''):'<div class="empty" style="margin-top:14px">Add a credit card, loan or money you owe. The app shows when you will be free of it and how much extra payments would save.</div>');
}
function debtForm(did){

 const m=modal(`<b>${did?'Edit debt':'Add a debt or loan'}</b><label class="muted">Name<input id="n" placeholder="e.g. Credit card" value="${esc(o.n)}"></label><label class="muted">${did?'Starting balance (AUD)':'Balance owing now (AUD)'}<input id="b" type="number" inputmode="decimal" step="any" value="${o.b0}"></label><label class="muted">Interest rate per year (%)<input id="i" type="number" inputmode="decimal" step="any" value="${o.apr}" placeholder="0 if none"></label><label class="muted">Payment each month (AUD)<input id="p" type="number" inputmode="decimal" step="any" value="${o.pay}"></label><button class="p" id="s">Save</button>${did?'<button class="o" id="x">Delete</button>':''}`);
 m.querySelector('#s').onclick=()=>{const n=m.querySelector('#n').value.trim(),b0=parseFloat(m.querySelector('#b').value),apr=parseFloat(m.querySelector('#i').value)||0,pay=parseFloat(m.querySelector('#p').value);if(!n||!(b0>0)||!(pay>0)){toast('Add a name, a balance and a monthly payment');return}
  const d={id:did||id(),n,b0,apr,pay,log:o.log||[]};if(did)D.db=D.db.map(x=>x.id===did?d:x);else D.db.push(d);m.remove();save()};
 if(did)m.querySelector('#x').onclick=()=>{if(!confirm('Delete this debt and its payment history?'))return;D.t=D.t.filter(t=>t.dbid!==did);D.db=D.db.filter(x=>x.id!==did);m.remove();save()};
}

 const d=D.db.find(x=>x.id===did);if(!d)return;let pf='Bank';const b=dbBal(d),s0=simDebt(b,d.apr,d.pay),hist=[...d.log].sort((a,c)=>c.d.localeCompare(a.d)).slice(0,5);
 const m=modal(`<b>${esc(d.n)}</b><div class="kv"><div>Owing<strong>${fmt(b,'AUD')}</strong></div><div>Rate<strong>${d.apr}%</strong></div><div>Monthly<strong>${fmt(d.pay,'AUD')}</strong></div></div><p style="margin:0">${b<=0?'This debt is paid off.':s0.ok?`At this pace you finish in <b>${inMonths(s0.m)}</b> and pay <b>${fmt(s0.int,'AUD')}</b> in interest.`:'The payment does not cover the interest.'}</p>

 m.querySelectorAll('[data-r]').forEach(r=>r.onclick=()=>{const p=d.log.find(x=>x.id===r.dataset.r);if(p&&p.tid)D.t=D.t.filter(t=>t.id!==p.tid);d.log=d.log.filter(x=>x.id!==r.dataset.r);m.remove();save()});
}

/* ===== Savings pace and suggestion ===== */
function goalPace(g){const sv=svSaved(g);if(!g.d||sv>=g.t)return'';const st=g.start||(g.log[0]&&g.log[0].d)||day(new Date()),s0=new Date(st+'T12:00:00'),e0=new Date(g.d+'T12:00:00'),span=e0-s0;if(span<=0)return'';const frac=Math.max(0,Math.min(1,(new Date()-s0)/span)),init=g.log.filter(x=>x.d<=st).reduce((s,x)=>s+x.a,0),diff=sv-(init+(g.t-init)*frac);if(Math.abs(diff)<1)return' You are right on plan.';return diff>0?` You are <b class="pos">${fmt(diff,'AUD')} ahead</b> of plan.`:` You are <b class="over">${fmt(-diff,'AUD')} behind</b> plan.`}
function suggestSave(a,cur){
 if(!D.sv.length||cur!=='AUD')return;const open=D.sv.filter(g=>svSaved(g)<g.t);if(!open.length)return;const pick=open.slice().sort((x,y)=>(x.d||'9').localeCompare(y.d||'9'))[0],sug=Math.max(5,Math.round(a*.1/5)*5);
 const m=modal(`<b>Put some toward a goal?</b><p class="muted" style="margin:0">You just recorded ${fmt(a,'AUD')}. Saving even 10% adds up.</p><select id="g">${open.map(g=>`<option value="${g.id}" ${g.id===pick.id?'selected':''}>${esc(g.n)}</option>`).join('')}</select><label class="muted">Amount to save<input id="a" type="number" inputmode="decimal" step="any" value="${sug}"></label><button class="p" id="s">Add to goal</button><button class="o" id="x">Not now</button>`);
 m.querySelector('#x').onclick=()=>m.remove();
 m.querySelector('#s').onclick=()=>{const v=parseFloat(m.querySelector('#a').value),g=D.sv.find(z=>z.id===m.querySelector('#g').value);if(!g||!(v>0))return;g.log.push({id:id(),d:day(new Date()),a:v});m.remove();save();toast('Added '+fmt(v,'AUD')+' to '+g.n)};
}

/* ===== Alerts ===== */
function alerts(){
 const a=[],n=new Date();
 D.u.forEach(u=>{const x=ddays(u.d);if(x<=3)a.push(u.n+' '+fmt(u.a,u.c)+' '+(x<0?-x+' days overdue':x===0?'due today':'due in '+x+' days'))});
 const r=rentInfo();if(r&&r.days<=3)a.push('Rent '+rentWhen(r.days));
 D.e.filter(e=>e.gave&&e.due&&ddays(e.due)<0&&bal(e.pid)>0).forEach(e=>{const p=D.p.find(x=>x.id===e.pid);if(p)a.push(p.name+' owes you '+fmt(e.a,e.c)+' (overdue)')});
 const by={};D.t.filter(t=>!t.tr&&!t.in&&inR(t,new Date(n.getFullYear(),n.getMonth(),1),new Date(n.getFullYear(),n.getMonth()+1,1))).forEach(t=>by[t.cat]=(by[t.cat]||0)+base(t.a,t.c));
 Object.keys(D.b).forEach(k=>{const v=by[k]||0,b=D.b[k];if(b>0&&v>=b)a.push(k+' budget used up: '+fmt(v,'AUD')+' of '+fmt(b,'AUD'));else if(b>0&&v>=.8*b)a.push(k+' budget '+Math.round(100*v/b)+'% used ('+fmt(v,'AUD')+' of '+fmt(b,'AUD')+')')});
 const tot=Object.values(by).reduce((s,x)=>s+x,0),dn=n.getDate(),dm=dimOf(n.getFullYear(),n.getMonth());
 if(dn>=7){const prev=[1,2,3].map(i=>{const f=new Date(n.getFullYear(),n.getMonth()-i,1);return D.t.filter(t=>!t.tr&&!t.in&&inR(t,f,new Date(f.getFullYear(),f.getMonth()+1,1))).reduce((s,t)=>s+base(t.a,t.c),0)}).filter(x=>x>0);if(prev.length>=2){const avg=prev.reduce((s,x)=>s+x,0)/prev.length,proj=tot/dn*dm;if(proj>avg*1.3&&tot>avg*.5)a.push('Spending is on track for about '+fmt(proj,'AUD')+' this month, '+Math.round((proj/avg-1)*100)+'% above your usual '+fmt(avg,'AUD')+'.')}}
 const fi=funInfo();if(fi){if(fi.left<0)a.push('Fun money used up: '+fmt(fi.sp,'AUD')+' of '+fmt(fi.F.a,'AUD')+' this week');else if(fi.sp>=.8*fi.F.a)a.push('Fun money '+Math.round(100*fi.sp/fi.F.a)+'% used this week ('+fmt(fi.left,'AUD')+' left)')}
 return a;
}

/* ===== Tax year, claimable expenses and closing a year ===== */
const fyOf=o=>{const n=new Date(),y0=(n.getMonth()>=6?n.getFullYear():n.getFullYear()-1)+o;return{from:new Date(y0,6,1),to:new Date(y0+1,6,1),label:'FY '+y0+'–'+String(y0+1).slice(2),key:y0}};
function fyData(o){const F=fyOf(o),fs=day(F.from),fe=day(F.to),inF=t=>{const d=day(t.d);return d>=fs&&d<fe};
 const inc=D.t.filter(t=>t.in&&!t.tr&&t.cat!=='Repaid'&&inF(t)),claim=D.t.filter(t=>!t.in&&!t.tr&&t.wr&&inF(t)),all=D.t.filter(inF),ws=D.w.filter(w=>w.d>=fs&&w.d<fe);
 const sum=l=>l.reduce((s,t)=>s+base(t.a,t.c),0),bySrc={},byCat={};inc.forEach(t=>{const k=(t.pl||t.n||'Income').trim();bySrc[k]=(bySrc[k]||0)+base(t.a,t.c)});claim.forEach(t=>byCat[t.cat]=(byCat[t.cat]||0)+base(t.a,t.c));
 return{F,fs,fe,inc,claim,all,ws,incT:sum(inc),clT:sum(claim),outT:sum(all.filter(t=>!t.in&&!t.tr)),gross:wEarn(ws,'AUD'),hrs:ws.reduce((s,w)=>s+w.h,0),bySrc,byCat}}
function taxCsv(x){const q2=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';return 'date,type,category,place,note,amount,currency,work_related,receipt\n'+x.all.sort((a,b)=>a.d.localeCompare(b.d)).map(t=>[day(t.d),t.tr?'transfer':t.in?'income':'expense',q2(t.cat),q2(t.pl),q2(t.n),t.a,t.c,t.wr?'yes':'',t.rc?'yes':''].join(',')).join('\n')+'\n\nshift_date,place,hours,rate,currency,paid\n'+x.ws.map(w=>[w.d,q2(w.p),w.h,w.r,wc(w),w.paid?'yes':'no'].join(',')).join('\n')}

 const m=modal(`<b>Sync phone and laptop</b><p class="muted" style="margin:0">Each device keeps its own copy. To combine them: tap Send here, open the file on the other device, then tap Merge there. Nothing is replaced. New entries are added to what you already have. Do it both ways to bring both devices level.</p><button class="p" onclick="shareBackup()">Send my data to the other device</button><input id="f" type="file" accept=".json,application/json"><textarea id="t" rows="3" placeholder="Or paste backup text here"></textarea><button class="o" id="s">Merge into this device</button><p class="muted" style="font-size:13px;margin:0">If one entry was edited on both devices, this device wins. Something deleted on one device comes back if the other still has it. Undo works after a merge. Live sync would need an online account and a server, which this app does not use.</p>`);
 m.querySelector('#f').onchange=e=>{const r=new FileReader();r.onload=()=>m.querySelector('#t').value=r.result;r.readAsText(e.target.files[0])};

  const c=mergeIn(o);m.remove();save();toast(c?'Merged '+c+' new item'+(c>1?'s':'')+'. Tap Undo if this looks wrong.':'Already up to date')};
